workflows:
  ios-multiplatform-release:
    name: iOS Multiplatform Release Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    scripts:
      - name: Set up Java 17
        script: |
          jdk-default 17
      - name: Create .env Configuration
        script: |
          echo "GEMINI_API_KEY=${GEMINI_API_KEY:-AIzaSyBIWjn1ZwY4Ik5kA9bEVpSn_Yi7e7Yvj3A}" >> .env
          echo "FISH_AUDIO_API_KEY=${FISH_AUDIO_API_KEY:-sk-fish-XE6y_b0FjtPoMv2Ix6ElVqoX8esWVSRpdjLEKfw-84I}" >> .env
          echo "ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-sk_f419ef083a08e108b25968712c861c53312e25da41280c09}" >> .env
      - name: Make Gradle Wrapper Executable
        script: |
          chmod +x gradlew
      - name: Build iOS Multiplatform XCFramework
        script: |
          ./gradlew :shared:assemble
    artifacts:
      - shared/build/outputs/aar/*.aar
      - shared/build/XCFrameworks/release/*.xcframework
